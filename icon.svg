<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Sun / Celestial Glow -->
  <circle cx="360" cy="150" r="48" fill="#fef08a" opacity="0.95" />
  <circle cx="360" cy="150" r="70" fill="#fef08a" opacity="0.25" />
  
  <!-- Southern Cross constellation stars -->
  <circle cx="120" cy="90" r="6" fill="#ffffff" />
  <circle cx="120" cy="140" r="6" fill="#ffffff" />
  <circle cx="95" cy="115" r="5" fill="#ffffff" />
  <circle cx="140" cy="115" r="5" fill="#ffffff" />
  
  <!-- Cerro Espeche Silhouette -->
  <!-- Back Mountain -->
  <polygon points="120,400 240,240 370,400" fill="#92400e" opacity="0.7" />
  <!-- Front Peak (Cerro Espeche) -->
  <polygon points="200,420 330,190 470,420" fill="url(#mountainGrad)" />
  
  <!-- Palm Trees (Plaza Virgen del Carmen) -->
  <g transform="translate(140, 310) scale(0.65)">
    <!-- Trunk -->
    <path d="M 50,150 Q 55,70 50,0" stroke="#78350f" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Fronds -->
    <path d="M 50,0 Q 20,-30 -10,-10" stroke="#15803d" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 50,0 Q 80,-30 110,-10" stroke="#15803d" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 50,0 Q 10,-50 10,-80" stroke="#16a34a" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 50,0 Q 90,-50 90,-80" stroke="#16a34a" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Ground Line -->
  <rect x="0" y="400" width="512" height="112" rx="0" fill="#0f172a" />
  
  <!-- Text Label -->
  <text x="256" y="465" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="3">VILLA CASANA</text>
</svg>
